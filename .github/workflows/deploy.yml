name: Build and deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Verify Vercel credentials
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID FIREBASE_CONFIG_JSON; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            printf 'Missing GitHub Actions secret(s): %s\n' "${missing[*]}" >&2
            echo 'Add them in GitHub: Settings > Secrets and variables > Actions > New repository secret.' >&2
            exit 1
          fi

      - name: Pull Vercel project settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Configure Firebase client
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          node -e 'const fs=require("node:fs");const config=JSON.parse(process.env.FIREBASE_CONFIG_JSON);for(const key of ["apiKey","authDomain","projectId","appId"])if(typeof config[key]!=="string"||!config[key].trim()||config[key].startsWith("YOUR_"))throw Error(`Firebase config has a missing or placeholder ${key}`);fs.writeFileSync("firebase-config.js",`window.EXPENSE_MANAGER_FIREBASE = ${JSON.stringify(config)};\n`);'

      - name: Build Vercel deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Package deployed build output
        if: startsWith(github.ref, 'refs/tags/v')
        run: zip -qr Expense-Manager-vercel-output.zip .vercel/output

      - name: Upload release build for publishing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Expense-Manager-vercel-output
          path: Expense-Manager-vercel-output.zip
          if-no-files-found: error
          retention-days: 1

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download deployed build output
        uses: actions/download-artifact@v4
        with:
          name: Expense-Manager-vercel-output

      - name: Create release and attach deployed build
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Expense-Manager-vercel-output.zip
          fail_on_unmatched_files: true

  deploy:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Download released build output
        uses: actions/download-artifact@v4
        with:
          name: Expense-Manager-vercel-output

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel project settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Restore released build output
        run: unzip -oq Expense-Manager-vercel-output.zip

      - name: Deploy released build to Vercel production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
